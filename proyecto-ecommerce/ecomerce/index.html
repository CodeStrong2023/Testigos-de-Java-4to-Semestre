        <div id="detalle-producto"></div>

        <script>
            const productos = [
                // Aquí va tu lista de productos
            ];

            // Obtener el ID del producto desde la URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get("id"));

            // Encontrar el producto con el ID correspondiente
            const producto = productos.find(p => p.id === productId);

            if (producto) {
                const detalleContainer = document.getElementById("detalle-producto");
                detalleContainer.innerHTML = `
                    <h1>${producto.nombre}</h1>
                    <p>${producto.descripcion}</p>
                    <p>Precio: $${producto.precio}</p>
                    <img src="${producto.imagen}" alt="${producto.nombre}" width="300">
                `;
            } else {
                document.getElementById("detalle-producto").innerHTML = "<p>Producto no encontrado.</p>";
            }
        </script>
